name: CI/CD Pipeline - WebApp To-Do

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: PRUEBAS Y COBERTURA
  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas con cobertura
        run: npx jest --verbose --coverage --coverageReporters=text-summary

      - name: Mostrar resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de pruebas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Todas las pruebas se ejecutaron." >> $GITHUB_STEP_SUMMARY

  # JOB 2: BUILD Y PUSH A DOCKER HUB
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-todo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-todo:${{ github.sha }}

  # JOB 3: DESPLIEGUE EN EC2
  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Desplegar vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp-todo:latest
            docker stop webapp-todo-ec2 || true
            docker rm webapp-todo-ec2 || true
            docker run -d \
              -p 8080:80 \
              -p 6061:6061 \
              --name webapp-todo-ec2 \
              -v ~/todo-data:/app/data \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/webapp-todo:latest
            docker ps
            echo "Despliegue completado"